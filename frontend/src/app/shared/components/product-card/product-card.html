<div class="card-container relative overflow-hidden rounded-lg shadow-lg group cursor-pointer">
  <div class="aspect-4/4 overflow-hidden">
    <img
      [src]="image"
      [alt]="title"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 "
    />
  </div>
  <div
    class="absolute inset-0 bg-linear-to-t from-black/60 via-black/10 to-transparent flex flex-col justify-end p-6 md:p-8 transition-all"
  >
    <h3 class="text-white text-2xl md:text-3xl font-serif font-bold mb-2">{{ title }}</h3>
    <p class="text-white/90 text-sm md:text-base mb-4">{{ description }}</p>
    <button
      class="bg-white text-neutral-900 px-6 py-2.5 rounded-md font-medium text-sm hover:bg-neutral-100 transition-colors w-fit"
    >
      {{ buttonText }}
    </button>
  </div>
</div>
