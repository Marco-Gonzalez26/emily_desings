<div class="h-screen grid grid-cols-1 lg:grid-cols-2 overflow-hidden">
  <!-- IMAGEN -->
  <div class="hidden lg:block relative">
    <img
      src="assets/images/login-background.jpg"
      alt="Emily Designs Fashion"
      class="absolute inset-0 w-full h-full object-cover"
    />
    <div class="absolute inset-0 bg-black/10"></div>
  </div>

  <!-- FORMULARIO -->
  <div class="flex items-center justify-center bg-white px-6 py-12 lg:px-8">
    <div class="w-full max-w-md space-y-8">
      <div class="text-center">
        <h1 class="text-3xl font-serif text-amber-700 mb-2">Emily Designs</h1>
        <h2 class="text-2xl font-light text-neutral-800">Crear Cuenta</h2>
      </div>

      <div
        *ngIf="errorMessage"
        class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm"
      >
        {{ errorMessage }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- NOMBRE -->
        <input
          type="text"
          formControlName="nombre_completo"
          placeholder="Nombre completo"
          class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-rose-300"
        />

        <!-- EMAIL -->
        <input
          type="email"
          formControlName="email"
          placeholder="Correo electrónico"
          class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-rose-300"
        />

        <!-- PASSWORD -->
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Contraseña"
            class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-rose-300 pr-10"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400"
          >
            👁
          </button>
        </div>

        <!-- TELÉFONO -->
        <input
          type="text"
          formControlName="telefono"
          placeholder="Teléfono (opcional)"
          class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-rose-300"
        />

        <!-- DIRECCIÓN -->
        <input
          type="text"
          formControlName="direccion"
          placeholder="Dirección (opcional)"
          class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-rose-300"
        />

        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-rose-400 hover:bg-rose-500 text-white py-3 rounded-lg transition flex justify-center"
        >
          {{ isLoading ? 'Creando cuenta...' : 'Registrarme' }}
        </button>

        <p class="text-center text-sm text-neutral-600">
          ¿Ya tienes una cuenta?
          <a routerLink="/iniciar-sesion" class="text-amber-700 font-medium"> Inicia sesión </a>
        </p>
      </form>
    </div>
  </div>
</div>
